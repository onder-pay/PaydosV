function genPDF(){

    // Baslik
    doc.setFontSize(18);doc.setTextColor(212,148,58);
    doc.text("PAYDOS TURIZM",105,18,{align:"center"});
    doc.setFontSize(13);doc.setTextColor(40);
    doc.text("DS-160 ABD Vize Basvuru Formu",105,26,{align:"center"});
    var nm=tr(D.fullNameTr||((D.firstName||"")+" "+(D.lastName||"")));
    doc.setFontSize(11);doc.setTextColor(100);
    doc.text(nm,105,33,{align:"center"});
    doc.setDrawColor(212,148,58);doc.line(20,37,190,37);
    var y=45;
    ST.forEach(function(ss){
      if(!ss.f.length)return;
      var sf=[];ss.f.forEach(function(f){if(vis(f)&&D[f.k])sf.push(f)});
      if(!sf.length)return;
      // Sayfa tasmasi
      if(y>270){doc.addPage();y=20}
      // Bolum basligi
      doc.setFontSize(11);doc.setTextColor(212,148,58);doc.setFont(undefined,"bold");
      doc.text(tr(ss.t),20,y);y+=6;
      doc.setFont(undefined,"normal");doc.setFontSize(9);doc.setTextColor(60);
      sf.forEach(function(f){
        if(y>280){doc.addPage();y=20}
        var lbl=tr(f.l)+": ";
        var val=tr(D[f.k]);
        var line=lbl+val;
        var split=doc.splitTextToSize(line,165);
        doc.text(split,24,y);
        y+=split.length*5;
      });
      y+=4;
    });
    // Footer
    doc.setFontSize(8);doc.setTextColor(150);
    var dt=new Date().toLocaleDateString("tr-TR");
    doc.text("Olusturma: "+dt+" | www.paydosturizm.com",105,290,{align:"center"});

}
