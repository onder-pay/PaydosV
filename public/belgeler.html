<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1020">
<!-- Ana ekrana eklenince uygulama gibi açılsın -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paydos">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Paydos Turizm - Seyahat Belgeleriniz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1020;--card:#141a33;--line:#262e52;--muted:#9aa3c7;--text:#eef1ff;--gold:#f5b942;--gold2:#ffd98a}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#1a2350 0%,var(--bg) 60%);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.c{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Playfair Display',serif;font-weight:700;font-size:18px;letter-spacing:1px;color:var(--text);margin-bottom:16px}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 4px 14px rgba(255,65,65,.35)}
.brand small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:2px;color:var(--muted)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 22px 22px;background:linear-gradient(135deg,#1d3fa8 0%,#6a2bd6 55%,#e0457b 100%);box-shadow:0 20px 50px -20px rgba(106,43,214,.6)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}
.hero::before{width:220px;height:220px;right:-70px;top:-80px;background:radial-gradient(circle,#ffd98a 0%,transparent 70%)}
.hero::after{width:180px;height:180px;left:-60px;bottom:-90px;background:radial-gradient(circle,#5ee7ff 0%,transparent 70%)}
.hero>*{position:relative}
.hello{font-size:15px;opacity:.9}
.dest{font-family:'Playfair Display',serif;font-size:40px;line-height:1.05;font-weight:700;margin:6px 0 2px;text-shadow:0 2px 20px rgba(0,0,0,.2)}
.country{font-size:14px;opacity:.85;letter-spacing:.5px}
.tname{margin-top:14px;font-size:15px;font-weight:700}
.dates{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;opacity:.9}
.count{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.25)}
.count b{font-size:20px;color:#fff}

/* Bölüm başlığı */
.sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin:26px 4px 10px;text-transform:uppercase}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}

/* Belge kutucukları */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--c,#f5b942)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.tile .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bgc,rgba(245,185,66,.15));flex-shrink:0}
.tile .tt{font-size:15px;font-weight:700;line-height:1.25}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px}
.tile .acts{margin-top:auto;display:flex;gap:6px}
.tile.wide .acts{margin:0 0 0 auto}
.tile .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 10px;border-radius:10px;font:700 13px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--c,#f5b942);white-space:nowrap}
.tile .btn.o{background:transparent;color:var(--c,#f5b942)}
.tile .btn.d{background:var(--c,#f5b942);color:#141a33}
.tile .btn:active{transform:scale(.96)}
.all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:14px;border-radius:16px;border:1px dashed var(--line);background:transparent;color:var(--text);font:700 14px 'DM Sans',sans-serif;cursor:pointer}
.all:active{transform:scale(.98)}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.25);color:var(--gold2);font-size:12px;line-height:1.5;display:none}

/* Biniş kartı */
.pass{position:relative;display:block;margin-bottom:12px;border-radius:20px;background:#fffaf0;color:#1b1f3b;text-decoration:none;overflow:hidden;box-shadow:0 12px 30px -15px rgba(0,0,0,.6)}
.pass .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(90deg,#1d3fa8,#6a2bd6);color:#fff;font-size:12px;font-weight:700;letter-spacing:1px}
.pass .ph .fn{font-size:15px;letter-spacing:.5px}
.pass .pb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 18px 14px}
.pass .pt{min-width:0}
.pass .pt.r{text-align:right}
.pass .iata{font-size:34px;font-weight:700;letter-spacing:1px;line-height:1}
.pass .city{font-size:12px;color:#6b7094;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pass .pt.r .city{margin-left:auto}
.pass .time{font-size:16px;font-weight:700;margin-top:6px}
.pass .path{flex:1;position:relative;height:44px;min-width:60px;background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.pass .path::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px dashed #c9cce0}
.pass .plane{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:20px;animation:fly 3.2s ease-in-out infinite;line-height:1;pointer-events:none}
.hint{display:inline-block;margin:0 0 10px 4px;font-size:12px;color:var(--gold2);opacity:.85}
/* Mini oyun */
.game{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.94);display:flex;align-items:center;justify-content:center;padding:10px}
.game .gb{position:relative;width:100%;max-width:400px;height:min(94vh,760px);display:flex;flex-direction:column;align-items:center;padding:16px 16px 12px;border-radius:14px 14px 56px 14px;background:linear-gradient(160deg,#dcd8d0,#c9c4ba);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 20px 60px rgba(0,0,0,.6);font-family:'Courier New',monospace}
.game .scr{position:relative;width:100%;flex:1;min-height:0;border-radius:8px 8px 28px 8px;background:#555a66;padding:12px;box-shadow:inset 0 0 0 2px #444}
.game canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:3px;image-rendering:pixelated}
.game .gbl{margin:8px 0 2px;color:#2b2f85;font:italic 700 15px Arial,sans-serif;letter-spacing:1px}.game .gbl span{color:#9a2257;font-style:normal}
.game .pad{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.game .dpad{position:relative;width:118px;height:118px}
.game .k{position:absolute;width:40px;height:40px;border:none;background:#222;color:#666;font-size:14px;border-radius:5px;touch-action:none;cursor:pointer}
.game .k:active,.game .rb:active,.game .pill:active{filter:brightness(1.6)}
.game .k.u{left:39px;top:0}.game .k.l{left:0;top:39px}.game .k.r{right:0;top:39px}.game .k.d{left:39px;bottom:0}
.game .ab{display:flex;gap:14px;transform:rotate(-20deg);margin-right:4px}
.game .rb{width:54px;height:54px;border-radius:50%;border:none;background:#9a2257;color:#e8c9d6;font:700 18px Arial,sans-serif;box-shadow:0 3px 0 #6d1740;touch-action:none;cursor:pointer}
.game .ss{display:flex;gap:18px;margin-top:6px}
.game .pill{padding:6px 12px;border:none;border-radius:10px;background:#7d7a75;color:#2b2f85;font:700 10px Arial,sans-serif;letter-spacing:1px;transform:rotate(-20deg);cursor:pointer}
.game .gbh{margin-top:6px;font-size:10px;color:#6b675f;text-align:center}
.game .x{position:absolute;top:-6px;right:-6px;width:36px;height:36px;border-radius:50%;border:none;background:#222;color:#fff;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tet{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#306230,#0f380f);border:1px solid #8bac0f;color:#9bbc0f;cursor:pointer;width:100%;text-align:left;font:inherit}
.tet .ic{font-size:26px}.tet b{display:block;font:700 15px 'Courier New',monospace;letter-spacing:1px}.tet span{font-size:12px;color:#c7dc6f}
@keyframes fly{0%{left:8%}50%{left:92%}100%{left:8%}}
.pass .pf{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:2px dashed #e6e2d6;font-size:12px;color:#6b7094;position:relative}
.pass .pf::before,.pass .pf::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass .pf::before{left:-10px}.pass .pf::after{right:-10px}
.pass .live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#e0457b;font-size:13px}
.pass .live i{width:8px;height:8px;border-radius:50%;background:#e0457b;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,69,123,.6)}100%{box-shadow:0 0 0 10px rgba(224,69,123,0)}}
.pass .raw{padding:16px 18px;font-size:14px}

/* İletişim */
.contact{display:flex;align-items:center;gap:12px;margin-top:26px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.contact .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(245,185,66,.15);font-size:20px}
.contact .tx{flex:1;font-size:13px;color:var(--muted)}
.contact .tx b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}
.contact a{padding:10px 16px;border-radius:12px;background:var(--gold);color:#1b1f3b;font-weight:700;font-size:14px;text-decoration:none}
.foot{text-align:center;font-size:11px;color:#5d6591;margin-top:20px;letter-spacing:1px}

/* Seyahat bilgileri */
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:0}
.ib.wide{grid-column:1/-1}
.ib .h{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.ib .v{font-size:20px;font-weight:700;line-height:1.2}
.ib .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.days{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;text-align:center;padding:8px 6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px}
.day .e{font-size:22px;line-height:1.3}
.day b{display:block;font-size:13px}
.wear{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(94,231,255,.08);border:1px solid rgba(94,231,255,.22);font-size:13px;line-height:1.5}
.hotel{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.hotel .n{font-size:16px;font-weight:700}
.hotel .a{font-size:13px;color:var(--muted);line-height:1.45}
.hotel .b{display:flex;gap:8px}
.hotel .b a{flex:1;text-align:center;padding:10px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--gold);color:var(--gold)}
.hotel .b a.p{background:var(--gold);color:#1b1f3b}
.contact .bt{display:flex;gap:6px}
.disc{display:none;margin:10px 4px 0;font-size:11px;line-height:1.5;color:#6f78a3}
.contact a.wa{background:#25d366;color:#fff}

.ig{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#feda75 0%,#fa7e1e 25%,#d62976 55%,#962fbf 80%,#4f5bd5 100%);box-shadow:0 10px 30px -12px rgba(214,41,118,.6)}
.ig .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.ig .tx{flex:1;font-size:12px;opacity:.95}.ig .tx b{display:block;font-size:15px;opacity:1}
.ig .go{padding:9px 14px;border-radius:12px;background:#fff;color:#d62976;font-weight:700;font-size:13px;white-space:nowrap}
.inst{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(245,185,66,.14),rgba(106,43,214,.14));border:1px solid rgba(245,185,66,.3)}
.inst .ic{font-size:26px}
.inst .tx{flex:1;font-size:13px;line-height:1.45;color:var(--text)}
.inst .tx b{display:block;font-size:14px;margin-bottom:2px}
.inst .go{padding:10px 14px;border-radius:12px;border:none;background:var(--gold);color:#1b1f3b;font:700 13px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.inst .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.offline{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(106,168,255,.12);border:1px solid rgba(106,168,255,.3);color:#b9d4ff;font-size:12px;text-align:center}
.msg{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;line-height:1.6}
.in{opacity:0;transform:translateY(12px);animation:up .5s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}.pass .plane{animation:none;left:50%}.pass .live i{animation:none}}
@media (max-width:360px){.dest{font-size:32px}.pass .iata{font-size:28px}}
</style>
</head>
<body>
<div class="c">
  <div class="brand"><img src="/icons/logo.png" alt="Paydos">PAYDOS TURİZM</div>
  <div id="box"><div class="msg">Yükleniyor…</div></div>
</div>
<script>
(function () {
  var box = document.getElementById('box');
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var show = function (t) { box.innerHTML = ''; box.appendChild(el('div', 'msg', t)); };
  // Link biçimi: /b/<kod>  (eski/yedek: belgeler.html?k=<kod>)
  var m = location.pathname.match(/\/b\/([A-Za-z0-9]{8,40})\/?$/);
  var code = m ? m[1] : (new URLSearchParams(location.search).get('k') || '');
  if (!/^[A-Za-z0-9]{8,40}$/.test(code)) { show('Geçersiz bağlantı.'); return; }

  // ===== Ana ekrana ekleme (PWA) =====
  // Kişiye özel manifest: ana ekrandan açılınca doğrudan bu müşterinin linki açılır.
  var ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = '/.netlify/functions/belge-manifest?k=' + code; document.head.appendChild(ml);
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/belge-sw.js', { scope: '/b/' }).catch(function () {}); }
  var deferredPrompt = null, instCard = null;
  var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var instDismissed = false; try { instDismissed = localStorage.getItem('paydos_inst_x_' + code) === '1'; } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; if (instCard) instCard.style.display = 'flex'; });
  window.addEventListener('appinstalled', function () { if (instCard) instCard.style.display = 'none'; });
  var renderInstall = function (parent) {
    if (isStandalone || instDismissed) return;
    instCard = el('div', 'inst');
    instCard.appendChild(el('div', 'ic', '📲'));
    var tx = el('div', 'tx'); tx.appendChild(el('b', '', 'Ana ekrana ekleyin'));
    tx.appendChild(document.createTextNode(isIOS ? 'Alttaki Paylaş ⬆️ düğmesine, sonra "Ana Ekrana Ekle"ye dokunun.' : 'Uygulama gibi açılsın, internet yokken de görünsün.'));
    instCard.appendChild(tx);
    if (!isIOS) {
      var go = el('button', 'go', 'Ekle'); go.type = 'button';
      go.addEventListener('click', function () {
        if (!deferredPrompt) { alert('Tarayıcı menüsünden (⋮) "Ana ekrana ekle" / "Uygulamayı yükle" seçeneğine dokunun.'); return; }
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; instCard.style.display = 'none'; });
      });
      instCard.appendChild(go);
    }
    var x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Kapat');
    x.addEventListener('click', function () { instCard.style.display = 'none'; try { localStorage.setItem('paydos_inst_x_' + code, '1'); } catch (e) {} });
    instCard.appendChild(x);
    parent.appendChild(instCard);
  };

  // Firestore REST değer biçimini düz JS'e çevir
  var val = function (v) {
    if (!v) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(val);
    if ('mapValue' in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = val(f[k]); return o; }
    return null;
  };
  var AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var parseD = function (s) { var p = String(s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; };
  var fmtD = function (d) { return d ? d.getDate() + ' ' + AY[d.getMonth()] : ''; };
  // Sadece Firebase Storage adreslerine bağlantı verilir
  var safeUrl = function (u) { try { var x = new URL(u); return x.protocol === 'https:' && /(^|\.)(firebasestorage\.googleapis\.com|storage\.googleapis\.com)$/.test(x.hostname) ? x.href : ''; } catch (e) { return ''; } };
  // "Ankara ESB · 12:15" → { city: 'Ankara', iata: 'ESB', time: '12:15' }
  var parsePt = function (s) {
    s = String(s || '');
    var iata = (s.match(/\b([A-Z]{3})\b/) || [])[1] || '';
    var time = (s.match(/(\d{1,2}:\d{2}(?:\s*\(\+\d\))?)/) || [])[1] || '';
    var city = s.split(iata || '·')[0].replace(/[·|,]/g, ' ').trim();
    return { city: city, iata: iata, time: time };
  };
  // Belge türüne göre renk
  var STYLE = {
    '🗺️': ['#34d3c4', 'rgba(52,211,196,.14)', 'Günlük program ve detaylar'],
    '🏨': ['#f5b942', 'rgba(245,185,66,.15)', 'Otel girişinde gösterin'],
    '✈️': ['#6aa8ff', 'rgba(106,168,255,.15)', 'E-bilet'],
    '🎫': ['#ff7aa8', 'rgba(255,122,168,.15)', 'Fuar girişinde gösterin'],
    '🛫': ['#22d3ee', 'rgba(34,211,238,.15)', 'Güvenlik ve kapıda gösterin'],
    '🛬': ['#c084fc', 'rgba(192,132,252,.15)', 'Dönüşte güvenlik ve kapıda gösterin']
  };
  var delay = 0;
  var add = function (parent, node) { node.classList.add('in'); node.style.animationDelay = (delay += 0.06) + 's'; parent.appendChild(node); return node; };


  // ===== Nostaljik Tetris (Game Boy görünümü) — tamamen sayfanın içinde, internetsiz de oynanır =====
  var openGame = function () {
    var BEST_KEY = 'paydos_tetris_best', best = 0;
    try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}
    var C0 = '#9bbc0f', C1 = '#8bac0f', C2 = '#306230', C3 = '#0f380f'; // Game Boy yeşilleri
    var ov = el('div', 'game'), gb = el('div', 'gb'), scr = el('div', 'scr'), cv = el('canvas'), x = el('button', 'x', '✕');
    x.type = 'button'; x.setAttribute('aria-label', 'Oyunu kapat');
    var brand = el('div', 'gbl', 'PAYDOS BOY'); brand.appendChild(el('span', '', ' TETRIS'));
