<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f3ef">
<!-- Ana ekrana eklenince uygulama gibi açılsın -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paydos">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Paydos Turizm · Seyahat Dosyası</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Müşteri linki — kurumsal "seyahat dosyası" görünümü. Tek vurgu rengi (Paydos kırmızısı) az kullanılır. */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f3ef;--card:#fff;--ink:#0f1b2e;--ink2:#2c384c;--muted:#6b7487;--faint:#9aa1b0;--line:#e4e2db;--soft:#f7f6f2;--navy:#13223a;--accent:#d7262f;--ok:#1f8a5b}
body{min-height:100vh;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.c{max-width:560px;margin:0 auto;padding:18px 16px 48px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 2px 16px;font-weight:800;font-size:12px;letter-spacing:3px;color:var(--ink)}
.brand img{width:30px;height:30px;border-radius:50%}
.brand small{margin-left:auto;font-weight:600;font-size:11px;letter-spacing:1px;color:var(--muted)}

/* Kapak */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:24px 22px 20px;color:#fff;background:var(--navy)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(500px 220px at 100% 0%,rgba(255,255,255,.10),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px)}
.hero::after{content:'';position:absolute;left:22px;top:0;width:36px;height:3px;background:var(--accent);border-radius:0 0 2px 2px}
.hero>*{position:relative}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.name{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin:8px 0 18px}
.stats{display:grid;grid-template-columns:1.4fr 1fr;border-top:1px solid rgba(255,255,255,.14)}
.st{padding:14px 0 2px}.st+.st{padding-left:16px;border-left:1px solid rgba(255,255,255,.14)}
.st .k{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55)}
.st .v{font-size:19px;font-weight:700;margin-top:4px}
.st .s{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;letter-spacing:.5px}
.lead{margin-top:16px;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.62)}

/* Bölüm başlığı */
.sec{display:flex;align-items:baseline;gap:8px;margin:30px 2px 12px}
.sec b{font-size:15px;font-weight:700;letter-spacing:-.1px}
.sec span{font-size:12px;color:var(--faint);font-weight:600}
.mon{margin:16px 2px 8px;font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}

/* Uçuş */
.pass{display:block;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pass:hover{border-color:#cfccc2;box-shadow:0 8px 24px -16px rgba(15,27,46,.35)}
.pass .ptop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.pass .fno{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:1px}
.pass .route{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.pass .pt{min-width:0}.pass .pt.r{text-align:right}
.pass .iata{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;letter-spacing:1px;line-height:1}
.pass .city{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pass .pt.r .city{margin-left:auto}
.pass .time{font-size:15px;font-weight:700;margin-top:6px}
.pass .line{flex:1;display:flex;align-items:center;gap:6px;color:var(--faint)}
.pass .line::before,.pass .line::after{content:'';flex:1;border-top:1px dashed #cdcac0}
.pass .pf{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--soft);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pass .live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);font-size:12.5px}
.pass .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(215,38,47,.15)}
.pass .raw{padding:16px;font-size:14px}
a.pf{text-decoration:none}
/* Canlı konum (adsb.lol) */
.trk{border-top:1px solid var(--line)}
.trk .th{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;font-size:12px;color:var(--muted)}
.trk .tl{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:var(--ink)}
.trk .tl i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.trk.on .tl i{background:var(--accent);animation:blink 1.6s infinite}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(215,38,47,.12)}}
.trk .map{height:200px;background:#e9e8e3}
.trk .map .leaflet-tile-pane{filter:saturate(.3) contrast(.95) brightness(1.03)}
.trk .tst{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}
.trk .tst div{padding:10px 14px;min-width:0}.trk .tst div+div{border-left:1px solid var(--line)}
.trk .tst b{display:block;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tst span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.trk .tmsg{padding:2px 16px 14px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.trk .tgo{margin:0 16px 14px;height:38px;width:calc(100% - 32px);border-radius:10px;border:1px solid var(--navy);background:transparent;color:var(--navy);font:700 13px 'Manrope',sans-serif;cursor:pointer}
.trk .tsrc{padding:6px 16px 8px;font-size:10px;color:var(--faint);border-top:1px solid var(--line)}
.trk .tsrc a{color:inherit}
.leaflet-container{font-family:'Manrope',sans-serif}
.pl{width:30px;height:30px;color:var(--navy);filter:drop-shadow(0 2px 3px rgba(15,27,46,.35))}
.pl svg{width:30px;height:30px;fill:currentColor;stroke:#fff;stroke-width:1}

/* Belgeler */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.doc{display:flex;align-items:center;gap:12px;padding:13px 14px}
.doc+.doc{border-top:1px solid var(--line)}
.doc .dic{width:40px;height:40px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.doc .dtx{flex:1;min-width:0}
.doc .dt{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .ds{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .acts{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;font:700 13px 'Manrope',sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.d{background:var(--navy);border-color:var(--navy);color:#fff;width:36px;padding:0}
.btn svg.i{width:17px;height:17px}
.btn:active{transform:scale(.97)}
.all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 13.5px 'Manrope',sans-serif;cursor:pointer}
.all:hover{background:var(--card)}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8e6;border:1px solid #f0dfae;color:#6b5414;font-size:12px;line-height:1.5;display:none}

/* Varış bilgileri */
.info{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.info:empty{display:none}
.ib{padding:14px 16px;min-width:0;background:var(--card)}
.ib.wide{grid-column:1/-1}
.ib .h{font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.ib .v{font-size:19px;font-weight:700;line-height:1.25}
.ib .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;text-align:center;padding:8px 6px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.day .e{font-size:16px;line-height:1.6;color:var(--ink2)}
.day b{display:block;font-size:13px;color:var(--ink)}
.wear{margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.hotel{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.hotel .n{font-size:15px;font-weight:700}
.hotel .a{font-size:12.5px;color:var(--muted);line-height:1.5}
.hotel .b{display:flex;gap:8px;margin-top:4px}
.hotel .b a{flex:1;display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.hotel .b a.p{background:var(--navy);border-color:var(--navy);color:#fff}
.disc{display:none;margin:10px 2px 0;font-size:10.5px;line-height:1.55;color:var(--faint)}

/* İletişim */
.contact{display:flex;align-items:center;gap:12px;margin-top:30px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.contact .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--line);color:var(--navy)}
.contact .tx{flex:1;font-size:12.5px;color:var(--muted);line-height:1.45}
.contact .tx b{display:block;color:var(--ink);font-size:14px;margin-bottom:1px}
.contact .bt{display:flex;gap:6px}
.contact a{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;text-decoration:none}
.contact a.wa{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ig{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 16px;border-radius:16px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line)}
.ig .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)}
.ig .tx{flex:1;font-size:12px;color:var(--muted)}.ig .tx b{display:block;font-size:14px;color:var(--ink)}
.ig .go{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:22px;letter-spacing:1.5px}

/* Ana ekrana ekle */
.inst{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.inst .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--navy)}
.inst .tx{flex:1;font-size:12px;line-height:1.45;color:var(--muted)}
.inst .tx b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:1px}
.inst .go{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--navy);background:transparent;color:var(--navy);font:700 13px 'Manrope',sans-serif;cursor:pointer;white-space:nowrap}
.inst .x{background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px}

/* PIN */
.pinc{margin:22px auto 0;max-width:400px;padding:28px 22px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.pinc .pic{width:52px;height:52px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff}
.pinc .pic svg.i{width:22px;height:22px}
.pinc .pt{font-size:21px;font-weight:700;letter-spacing:-.3px;margin:14px 0 6px}
.pinc .ps{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.pinc .pin{display:block;width:100%;margin:0 0 10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 24px 'IBM Plex Mono',monospace;letter-spacing:14px;text-align:center}
.pinc .pin::placeholder{color:#b9bdc7;letter-spacing:2px;font-size:14px;font-family:Manrope,sans-serif}
.pinc .pin:focus{outline:none;border-color:var(--navy);background:#fff}
.pinc .perr{min-height:18px;font-size:12.5px;color:var(--accent);margin-bottom:8px;font-weight:600}
.pinc .pbtn{width:100%;height:48px;border:none;border-radius:12px;background:var(--navy);color:#fff;font:700 14.5px 'Manrope',sans-serif;cursor:pointer}
.pinc .pbtn:disabled{opacity:.6}
.pinc .pnote{margin-top:14px;font-size:11.5px;color:var(--faint);line-height:1.5}

.offline{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef3fb;border:1px solid #d6e2f3;color:#2f4a73;font-size:12px;text-align:center}
.msg{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;line-height:1.6}
.empty{margin-top:14px;padding:28px 18px;border-radius:16px;border:1px dashed #d3d0c6;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.in{opacity:0;transform:translateY(8px);animation:up .45s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}
@media (max-width:360px){.name{font-size:25px}.pass .iata{font-size:24px}.doc .btn.o{padding:0 10px}}
</style>
</head>
<body>
<div class="c">
  <div class="brand"><img src="/icons/logo.png" alt="Paydos">PAYDOS TURİZM<small>Seyahat Dosyası</small></div>
  <div id="box"><div class="msg">Yükleniyor…</div></div>
</div>
<script>
(function () {
  var box = document.getElementById('box');
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var show = function (t) { box.innerHTML = ''; box.appendChild(el('div', 'msg', t)); };
  // Müşteri linki (kurumsal, turdan bağımsız): /m/<kod>  (yedek: musteri.html?k=<kod>). Tur linki ayrı sayfadır (/b/ → belgeler.html).
  var m = location.pathname.match(/\/m\/([A-Za-z0-9-]{8,60})\/?$/);
  var code = m ? m[1] : (new URLSearchParams(location.search).get('k') || '');
  if (!/^[A-Za-z0-9-]{8,60}$/.test(code)) { show('Geçersiz bağlantı.'); return; }

  // ===== Ana ekrana ekleme (PWA) =====
  // Kişiye özel manifest: ana ekrandan açılınca doğrudan bu müşterinin linki açılır.
  var ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = '/.netlify/functions/musteri-manifest?k=' + code; document.head.appendChild(ml);
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/musteri-sw.js', { scope: '/m/' }).catch(function () {}); }
  var deferredPrompt = null, instCard = null;
  var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var instDismissed = false; try { instDismissed = localStorage.getItem('paydos_inst_x_' + code) === '1'; } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; if (instCard) instCard.style.display = 'flex'; });
  window.addEventListener('appinstalled', function () { if (instCard) instCard.style.display = 'none'; });
  var renderInstall = function (parent) {
    if (isStandalone || instDismissed) return;
    instCard = el('div', 'inst');
    var iic = el('div', 'ic'); iic.appendChild(ico('home')); instCard.appendChild(iic);
    var tx = el('div', 'tx'); tx.appendChild(el('b', '', 'Ana ekrana ekleyin'));
    tx.appendChild(document.createTextNode(isIOS ? 'Paylaş düğmesine, sonra "Ana Ekrana Ekle"ye dokunun.' : 'Belgelerinize tek dokunuşla, internetsiz de ulaşın.'));
    instCard.appendChild(tx);
    if (!isIOS) {
      var go = el('button', 'go', 'Ekle'); go.type = 'button';
      go.addEventListener('click', function () {
        if (!deferredPrompt) { alert('Tarayıcı menüsünden (⋮) "Ana ekrana ekle" / "Uygulamayı yükle" seçeneğine dokunun.'); return; }
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; instCard.style.display = 'none'; });
      });
      instCard.appendChild(go);
    }
    var x = el('button', 'x', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'Kapat');
    x.addEventListener('click', function () { instCard.style.display = 'none'; try { localStorage.setItem('paydos_inst_x_' + code, '1'); } catch (e) {} });
    instCard.appendChild(x);
    parent.appendChild(instCard);
  };

  // Firestore REST değer biçimini düz JS'e çevir
  var val = function (v) {
    if (!v) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(val);
    if ('mapValue' in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = val(f[k]); return o; }
    return null;
  };
  var AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var parseD = function (s) { var p = String(s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; };
  var fmtD = function (d) { return d ? d.getDate() + ' ' + AY[d.getMonth()] : ''; };
  // Sadece Firebase Storage adreslerine bağlantı verilir
  var safeUrl = function (u) { try { var x = new URL(u); return x.protocol === 'https:' && /(^|\.)(firebasestorage\.googleapis\.com|storage\.googleapis\.com)$/.test(x.hostname) ? x.href : ''; } catch (e) { return ''; } };
  // "Ankara ESB · 12:15" → { city: 'Ankara', iata: 'ESB', time: '12:15' }
  var parsePt = function (s) {
    s = String(s || '');
    var iata = (s.match(/\b([A-Z]{3})\b/) || [])[1] || '';
    var time = (s.match(/(\d{1,2}:\d{2}(?:\s*\(\+\d\))?)/) || [])[1] || '';
    var city = s.split(iata || '·')[0].replace(/[·|,]/g, ' ').trim();
    return { city: city, iata: iata, time: time };
  };
  // Belge türüne göre renk
  var STYLE = {
    '🗺️': ['#34d3c4', 'rgba(52,211,196,.14)', 'Günlük program ve detaylar'],
    '🏨': ['#f5b942', 'rgba(245,185,66,.15)', 'Otel girişinde gösterin'],
    '✈️': ['#6aa8ff', 'rgba(106,168,255,.15)', 'E-bilet'],
    '🎫': ['#ff7aa8', 'rgba(255,122,168,.15)', 'Fuar girişinde gösterin'],
    '🛫': ['#22d3ee', 'rgba(34,211,238,.15)', 'Güvenlik ve kapıda gösterin'],

      var cic = el('div', 'ic'); cic.appendChild(ico('phone')); ct.appendChild(cic);
      var ctx = el('div', 'tx'); ctx.appendChild(el('b', '', 'Paydos Turizm')); ctx.appendChild(document.createTextNode('Seyahatinizle ilgili her konuda yanınızdayız.')); ct.appendChild(ctx);
      var bt = el('div', 'bt');
      if (wa.length >= 11) { var w = el('a', 'wa', 'WhatsApp'); w.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Merhaba, belgelerim hakkında yardım almak istiyorum.'); w.target = '_blank'; w.rel = 'noopener'; bt.appendChild(w); }
      var call = el('a', '', 'Ara'); call.href = 'tel:' + (ph.length >= 7 ? ph : '+902582637176'); bt.appendChild(call);
      ct.appendChild(bt);
      var ig = String(cf.instagram || '').replace(/^@/, '');
      if (/^[A-Za-z0-9._]{1,30}$/.test(ig)) {
        var ia = add(box, el('a', 'ig')); ia.href = 'https://www.instagram.com/' + ig + '/'; ia.target = '_blank'; ia.rel = 'noopener';
        var iic2 = el('div', 'ic'); iic2.appendChild(ico('ig')); ia.appendChild(iic2);
        var it = el('div', 'tx'); it.appendChild(el('b', '', '@' + ig)); it.appendChild(document.createTextNode('Yeni rotalar ve kampanyalar')); ia.appendChild(it);
        ia.appendChild(el('span', 'go', 'Takip et →'));
      }
      add(box, el('div', 'foot', 'PAYDOSTUR.COM'));
  };

  // ===== Veri: PIN korumalı belge API'si (Firebase fonksiyonu) =====
  // Müşteri linklerinde ilk açılışta müşteri 4 haneli PIN belirler; sonra bu telefonda hatırlanır.
  // İnternet yoksa en son açılan veri (bu telefonda) gösterilir.
  var API = 'https://europe-west1-paydos-crm.cloudfunctions.net/belge';
  var PIN_KEY = 'paydos_mpin_' + code, DATA_KEY = 'paydos_mdata_' + code;
  var lsGet = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var lsSet = function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var call = function (body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ k: code }, body)) })
      .then(function (r) { return r.json().catch(function () { return { state: 'error' }; }).then(function (j) { j._status = r.status; return j; }); });
  };
  var showData = function (data) { lsSet(DATA_KEY, JSON.stringify(data)); render(data); };
  var offlineFallback = function () {
    var c = lsGet(DATA_KEY);
    if (c) {
      try { render(JSON.parse(c)); } catch (e) { return show('Belgeler yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.'); }
      if (!box.querySelector('.offline')) box.appendChild(el('div', 'offline', 'İnternet yok — en son açılan bilgiler gösteriliyor.'));
      return;
    }
    show('Belgeler yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.');
  };

  // PIN ekranı: mode 'set' (ilk kez belirle) veya 'enter'
  var pinScreen = function (mode, name, msg) {
    box.innerHTML = '';
    var card = el('div', 'pinc');
    var pic = el('div', 'pic'); pic.appendChild(ico('lock')); card.appendChild(pic);
    card.appendChild(el('div', 'pt', (name ? 'Hoş geldiniz, ' + name : 'Hoş geldiniz')));
    card.appendChild(el('div', 'ps', mode === 'set'
      ? 'Seyahat dosyanızı korumak için 4 haneli bir PIN belirleyin. Sonraki girişlerde bu PIN sorulacak.'
      : 'Seyahat dosyanızı görüntülemek için 4 haneli PIN\'inizi girin.'));
    var mk = function (ph) { var i = document.createElement('input'); i.type = 'password'; i.inputMode = 'numeric'; i.autocomplete = 'off'; i.maxLength = 4; i.pattern = '[0-9]*'; i.placeholder = ph; i.className = 'pin'; i.addEventListener('input', function () { i.value = i.value.replace(/\D/g, '').slice(0, 4); }); return i; };
    var p1 = mk('PIN'), p2 = mode === 'set' ? mk('PIN tekrar') : null;
    card.appendChild(p1); if (p2) card.appendChild(p2);
    var err = el('div', 'perr', msg || ''); card.appendChild(err);
    var btn = el('button', 'pbtn', mode === 'set' ? 'PIN\'i kaydet ve devam et' : 'Devam et'); btn.type = 'button';
    card.appendChild(btn);
    card.appendChild(el('div', 'pnote', mode === 'set' ? 'PIN\'inizi unutursanız Paydos Turizm\'i arayın.' : 'PIN\'inizi unuttuysanız Paydos Turizm\'i arayın: 0 258 263 71 76'));
    box.appendChild(card);
    setTimeout(function () { p1.focus(); }, 50);
    var go = function () {
      var v = p1.value;
      if (!/^\d{4}$/.test(v)) { err.textContent = 'PIN 4 rakam olmalı.'; return; }
      if (p2 && p2.value !== v) { err.textContent = 'İki PIN aynı değil.'; return; }
      btn.disabled = true; btn.textContent = 'Kontrol ediliyor…';
      call({ a: mode === 'set' ? 'setpin' : 'unlock', pin: v }).then(function (j) {
        if (j.state === 'ok') { lsSet(PIN_KEY, v); showData(j.data); return; }
        if (j.state === 'locked') { pinScreen('enter', name, 'Çok fazla hatalı deneme. ' + (j.minutes || 15) + ' dakika sonra tekrar deneyin.'); return; }
        if (j.state === 'pin') { pinScreen('enter', name, j.error === 'wrong' ? 'PIN hatalı.' + (j.left ? ' Kalan deneme: ' + j.left : '') : 'Bu link için PIN zaten belirlenmiş. Lütfen PIN\'inizi girin.'); return; }
        btn.disabled = false; btn.textContent = 'Tekrar deneyin'; err.textContent = 'Bir hata oluştu.';
      }).catch(function () { btn.disabled = false; btn.textContent = 'Tekrar deneyin'; err.textContent = 'Bağlantı hatası.'; });
    };
    btn.addEventListener('click', go);
    [p1, p2].forEach(function (i) { if (i) i.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); });
  };

  var saved = lsGet(PIN_KEY);
  call(saved ? { a: 'unlock', pin: saved } : { a: 'get' }).then(function (j) {
    if (j.state === 'ok') return showData(j.data);
    if (j.state === 'notfound') { lsSet(DATA_KEY, null); return show('Bu bağlantı bulunamadı veya kaldırılmış.'); }
    if (j.state === 'setpin') { lsSet(PIN_KEY, null); lsSet(DATA_KEY, null); return pinScreen('set', j.name); }
    if (j.state === 'pin') { lsSet(PIN_KEY, null); lsSet(DATA_KEY, null); return pinScreen('enter', j.name, saved ? 'PIN değişmiş olabilir, lütfen yeniden girin.' : ''); }
    if (j.state === 'locked') return pinScreen('enter', j.name, 'Çok fazla hatalı deneme. ' + (j.minutes || 15) + ' dakika sonra tekrar deneyin.');
    offlineFallback();
  }).catch(offlineFallback);
})();
</script>
</body>
</html>
